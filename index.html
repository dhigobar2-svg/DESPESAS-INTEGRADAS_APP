<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel de Gestão da Telemetria · Logon | Arauco · Projeto Sucuriú</title>
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.2/dist/jspdf.plugin.autotable.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js"></script>
<style>
/* ===================== PALETA ARAUCO ===================== */
:root{
  --verde-sucuriu:#728046;
  --eco-verde:#BFB800;
  --naranjo:#EA7600;
  --corteza:#696158;
  --amarelo-arauco:#F3D01C;
  --laranja-claro:#F4BA80;
  --madera:#DFD1A7;
  --verde-claro:#DFDB80;
  --branco:#FFFFFF;

  --bg:#F4F5F0;
  --surface:#FFFFFF;
  --surface-2:#FAFBF7;
  --ink:#2B2A26;
  --ink-soft:#5E5B52;
  --line:#E4E5DC;
  --line-strong:#D4D6C8;

  --risco-baixo:#728046;
  --risco-medio:#EA7600;
  --risco-alto:#C0392B;

  --shadow-sm:0 1px 2px rgba(43,42,38,.06), 0 1px 3px rgba(43,42,38,.05);
  --shadow-md:0 2px 8px rgba(43,42,38,.07), 0 8px 24px rgba(43,42,38,.06);
  --shadow-lg:0 10px 40px rgba(43,42,38,.12);
  --radius:14px;
  --radius-sm:10px;
}
html[data-theme="dark"]{
  --bg:#1E201B;
  --surface:#282A24;
  --surface-2:#2E312A;
  --ink:#ECEDE4;
  --ink-soft:#A9AB9E;
  --line:#3A3D34;
  --line-strong:#484B40;
  --shadow-sm:0 1px 2px rgba(0,0,0,.3);
  --shadow-md:0 2px 10px rgba(0,0,0,.35);
  --shadow-lg:0 12px 44px rgba(0,0,0,.5);
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:var(--bg);
  background-image:radial-gradient(circle at 0% 0%,rgba(114,128,70,.045),transparent 45%),radial-gradient(circle at 100% 0%,rgba(191,184,0,.035),transparent 40%);
  background-attachment:fixed;
  color:var(--ink);
  font-size:14px;
  line-height:1.45;
  -webkit-font-smoothing:antialiased;
  transition:background .3s ease,color .3s ease;
}
h1,h2,h3,h4{font-weight:700;color:var(--ink);letter-spacing:-.01em}
/* Títulos em caixa alta (padrão corporativo) */
.topbar__title h1,.panel__head h3,.table-toolbar h3,.filterbar__head h3,
.insight-card__head h3,.modal__head h3,.km-card__plate,.dropzone h3,.nav-label{
  text-transform:uppercase;letter-spacing:.03em;
}
.topbar__title h1{letter-spacing:.02em;font-weight:800}
.panel__head h3,.table-toolbar h3,.filterbar__head h3{letter-spacing:.05em;font-size:12.5px;font-weight:800}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:6px}
::-webkit-scrollbar-track{background:transparent}

/* Gráfico de barras horizontal próprio (Registros por Condutor):
   nome nunca corta (quebra de linha), valor SEMPRE fora da barra, na ponta direita.
   A barra mais longa ocupa 86% da pista, reservando 14% para o valor por construção. */
.hbar-list{display:flex;flex-direction:column;gap:6px;padding:6px 4px 10px}
.hbar{display:grid;grid-template-columns:158px 1fr;gap:10px;align-items:center;width:100%;text-align:left;border-radius:8px;padding:3px 6px;transition:background .15s,opacity .2s}
.hbar:hover{background:var(--surface-2)}
.hbar.dim{opacity:.38}
.hbar.active{background:var(--surface-2)}
.hbar.active .hbar__name{color:var(--verde-sucuriu)}
.hbar__name{font-size:11px;font-weight:600;color:var(--ink);line-height:1.25;word-break:break-word}
.hbar__track{position:relative;height:20px;min-width:0}
.hbar__fill{position:absolute;left:0;top:1px;height:18px;border-radius:5px;min-width:3px;transition:width .35s ease}
.hbar__val{position:absolute;top:0;height:20px;display:flex;align-items:center;font-size:11px;font-weight:700;color:var(--ink);white-space:nowrap}

/* Contêiner com rolagem vertical para gráficos extensos (todos os condutores) */
.panel__body--scroll{max-height:430px;overflow-y:auto;overflow-x:hidden}
/* Cabeçalho de tabela ordenável (padrão asc/desc ao clicar) */
.th-sort{cursor:pointer;user-select:none;white-space:nowrap}
.th-sort .sort-ar{margin-left:4px;font-size:9px}

/* ===================== APP SHELL ===================== */
.app{display:flex;min-height:100vh}

/* Sidebar */
.sidebar{
  width:248px;flex-shrink:0;
  background:var(--surface);
  border-right:1px solid var(--line);
  display:flex;flex-direction:column;
  position:sticky;top:0;height:100vh;
  transition:width .25s ease;
  z-index:40;
}
.sidebar__brand{
  padding:22px 20px 18px;
  border-bottom:1px solid var(--line);
}
.brand-logo{display:flex;align-items:center;gap:11px}
.brand-txt strong{display:block;font-size:14px;line-height:1.1}
.brand-txt span{font-size:11px;color:var(--ink-soft)}
.sidebar__nav{padding:14px 12px;flex:1;overflow-y:auto}
.nav-label{
  font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;
  color:var(--ink-soft);font-weight:700;padding:12px 10px 6px;
}
.nav-item{
  display:flex;align-items:center;gap:11px;
  padding:10px 12px;border-radius:var(--radius-sm);
  color:var(--ink-soft);font-weight:600;font-size:13.5px;
  cursor:pointer;transition:all .15s ease;margin-bottom:2px;
  width:100%;text-align:left;
}
.nav-item:hover{background:var(--surface-2);color:var(--ink)}
.nav-item.active{
  background:linear-gradient(90deg,rgba(114,128,70,.13),rgba(114,128,70,.04));
  color:var(--verde-sucuriu);
}
html[data-theme="dark"] .nav-item.active{color:var(--eco-verde)}
.nav-item.active .nav-ic{color:var(--verde-sucuriu)}
html[data-theme="dark"] .nav-item.active .nav-ic{color:var(--eco-verde)}
.nav-ic{width:19px;height:19px;flex-shrink:0;display:grid;place-items:center}
.nav-ic svg{width:19px;height:19px;stroke-width:1.9}
.sidebar__foot{padding:14px;border-top:1px solid var(--line)}

/* Main */
.main{flex:1;min-width:0;display:flex;flex-direction:column}

/* Topbar */
.topbar{
  height:64px;flex-shrink:0;
  background:color-mix(in srgb,var(--surface) 88%,transparent);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:16px;
  padding:0 24px;position:sticky;top:0;z-index:30;
}
.topbar__title{flex:1;min-width:0}
.topbar__title h1{font-size:17px;line-height:1.2}
.topbar__title p{font-size:12px;color:var(--ink-soft)}
.topbar__meta{display:flex;align-items:center;gap:18px}
.meta-chip{display:flex;flex-direction:column;align-items:flex-end;line-height:1.2}
.meta-chip .k{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-soft);font-weight:700}
.meta-chip .v{font-size:13px;font-weight:700}
.status-dot{
  display:inline-flex;align-items:center;gap:7px;
  font-size:12px;font-weight:700;color:var(--verde-sucuriu);
  padding:6px 12px;border-radius:20px;background:rgba(114,128,70,.1);
}
.status-dot i{width:8px;height:8px;border-radius:50%;background:var(--verde-sucuriu);
  box-shadow:0 0 0 0 rgba(114,128,70,.5);animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(114,128,70,.45)}70%{box-shadow:0 0 0 8px rgba(114,128,70,0)}100%{box-shadow:0 0 0 0 rgba(114,128,70,0)}}
.icon-btn{
  width:38px;height:38px;border-radius:10px;
  display:grid;place-items:center;color:var(--ink-soft);
  border:1px solid var(--line);background:var(--surface);transition:all .15s ease;
}
.icon-btn:hover{background:var(--surface-2);color:var(--ink);border-color:var(--line-strong)}
.icon-btn svg{width:19px;height:19px}

/* Content area */
.content{padding:24px;flex:1}
.view{display:none;animation:fade .35s ease}
.view.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ===================== EMPTY / UPLOAD ===================== */
.dropzone{
  border:2px dashed var(--line-strong);border-radius:var(--radius);
  padding:48px 28px;text-align:center;background:var(--surface);
  transition:all .2s ease;
}
.dropzone.drag{border-color:var(--verde-sucuriu);background:rgba(114,128,70,.05)}
.dropzone__ic{
  width:64px;height:64px;margin:0 auto 16px;border-radius:16px;
  background:linear-gradient(135deg,rgba(114,128,70,.15),rgba(191,184,0,.12));
  display:grid;place-items:center;color:var(--verde-sucuriu);
}
.dropzone__ic svg{width:30px;height:30px}
.dropzone h3{font-size:18px;margin-bottom:6px}
.dropzone p{color:var(--ink-soft);font-size:13.5px;max-width:520px;margin:0 auto 18px}
.btn{
  display:inline-flex;align-items:center;gap:8px;
  padding:10px 18px;border-radius:10px;font-weight:700;font-size:13.5px;
  background:var(--verde-sucuriu);color:#fff;transition:all .15s ease;
  box-shadow:var(--shadow-sm);
}
.btn:hover{filter:brightness(1.06);transform:translateY(-1px);box-shadow:var(--shadow-md)}
.btn--ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line-strong)}
.btn--ghost:hover{background:var(--surface-2)}
.btn--sm{padding:7px 13px;font-size:12.5px}
.btn svg{width:16px;height:16px}

/* File chips */
.file-strip{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px;justify-content:center}
.file-chip{
  display:inline-flex;align-items:center;gap:8px;
  padding:7px 12px;border-radius:20px;background:var(--surface-2);
  border:1px solid var(--line);font-size:12.5px;font-weight:600;
}
.file-chip .plate{color:var(--verde-sucuriu);font-weight:800}
.file-chip button{color:var(--ink-soft);display:grid;place-items:center;width:16px;height:16px}
.file-chip button:hover{color:var(--risco-alto)}
.file-chip svg{width:14px;height:14px}

/* ===================== FILTER BAR ===================== */
.filterbar{
  background:var(--surface);border:1px solid var(--line);
  border-radius:var(--radius);padding:16px 18px;margin-bottom:20px;
  box-shadow:var(--shadow-sm);
}
.filterbar__head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.filterbar__head h3{font-size:13.5px;display:flex;align-items:center;gap:8px}
.filterbar__head h3 svg{width:17px;height:17px;color:var(--verde-sucuriu)}
.filter-grid{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px 14px;
}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:11px;font-weight:700;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.04em}
.field input,.field select{
  padding:8px 10px;border:1px solid var(--line-strong);border-radius:9px;
  background:var(--surface-2);color:var(--ink);font-size:13px;font-family:inherit;
  transition:border-color .15s ease;width:100%;
}
.field input:focus,.field select:focus{outline:none;border-color:var(--verde-sucuriu);box-shadow:0 0 0 3px rgba(114,128,70,.12)}
.field-row{display:flex;gap:8px}
.field-row .field{flex:1}
.filter-actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;align-items:center}
.applied-count{margin-left:auto;font-size:12px;color:var(--ink-soft);font-weight:600}

/* Período — botão + popover */
.period-btn{
  display:flex;align-items:center;gap:9px;width:100%;
  padding:8px 11px;border:1px solid var(--line-strong);border-radius:9px;
  background:var(--surface-2);color:var(--ink);font-size:13px;font-weight:600;
  transition:border-color .15s ease;text-align:left;
}
.period-btn:hover{border-color:var(--verde-sucuriu)}
.period-btn svg{width:16px;height:16px;color:var(--verde-sucuriu);flex-shrink:0}
.period-btn .pv{flex:1}
.period-btn .chev{width:13px;height:13px;color:var(--ink-soft);opacity:.7}
.period-pop{
  position:absolute;z-index:50;margin-top:6px;min-width:280px;
  background:var(--surface);border:1px solid var(--line-strong);border-radius:12px;
  box-shadow:var(--shadow-lg);padding:16px;
}
.period-pop .pp-row{display:flex;gap:10px;margin-bottom:12px}
.period-pop .pp-row .field{flex:1}
.period-pop .pp-foot{display:flex;gap:10px;justify-content:space-between;align-items:center}
.period-pop .pp-hint{font-size:11px;color:var(--ink-soft);font-weight:600;line-height:1.3;flex:1}
.field-wrap{position:relative}

/* ===================== MULTISELECT (filtros de lista) ===================== */
.ms{position:relative}
.ms-btn{
  display:flex;align-items:center;gap:8px;width:100%;
  padding:8px 11px;border:1px solid var(--line-strong);border-radius:9px;
  background:var(--surface-2);color:var(--ink);font-size:13px;font-weight:600;
  text-align:left;transition:border-color .15s ease;cursor:pointer;
}
.ms-btn:hover{border-color:var(--verde-sucuriu)}
.ms-btn .ms-summary{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ms-btn svg{width:13px;height:13px;color:var(--ink-soft);flex-shrink:0}
.ms-pop{
  position:absolute;z-index:60;left:0;right:0;margin-top:5px;min-width:0;max-width:260px;
  background:var(--surface);border:1px solid var(--line-strong);border-radius:9px;
  box-shadow:var(--shadow-lg);padding:8px;
}
.ms-search{display:flex;align-items:center;gap:6px;border:1px solid var(--line-strong);
  border-radius:7px;padding:4px 8px;margin-bottom:7px;background:var(--surface-2)}
.ms-search svg{width:13px;height:13px;color:var(--ink-soft);flex-shrink:0}
.ms-search input{border:none;background:transparent;outline:none;color:var(--ink);
  font-size:12px;width:100%;font-family:inherit}
.ms-actions{display:flex;gap:14px;margin-bottom:6px;padding:1px 4px 5px}
.ms-actions button{flex:0 0 auto;font-size:11px;font-weight:800;letter-spacing:.05em;
  text-transform:uppercase;padding:0;border:none;background:none;color:#8a850a;
  cursor:pointer;font-family:inherit}
.ms-actions button:hover{color:var(--verde-sucuriu);text-decoration:underline}
.ms-list{max-height:190px;overflow:auto;display:flex;flex-direction:column;gap:1px}
.ms-list label{display:flex;align-items:center;gap:8px;padding:5px 6px;border-radius:6px;
  font-size:12px;font-weight:600;cursor:pointer}
.ms-list label:hover{background:var(--surface-2)}
.ms-list input{width:14px;height:14px;accent-color:var(--verde-sucuriu);flex-shrink:0}
.ms-list .ms-empty{font-size:11.5px;color:var(--ink-soft);padding:5px 6px}

/* ===================== MENU DE EXPORTAÇÃO (kebab) ===================== */
#exportWrap{position:relative}
.export-menu{
  position:absolute;right:0;top:calc(100% + 8px);min-width:200px;z-index:130;
  background:var(--surface);border:1px solid var(--line-strong);border-radius:12px;
  box-shadow:var(--shadow-lg);padding:6px;
}
.export-menu .em-head{font-size:10.5px;font-weight:800;letter-spacing:.06em;
  color:var(--ink-soft);padding:7px 11px 5px;text-transform:uppercase}
.export-menu button{display:flex;align-items:center;gap:10px;width:100%;padding:9px 11px;
  border-radius:8px;background:transparent;border:none;color:var(--ink);font-size:13px;
  font-weight:600;text-align:left;font-family:inherit;cursor:pointer}
.export-menu button:hover{background:var(--surface-2)}
.export-menu .em-sep{height:1px;background:var(--line);margin:5px 8px}
.export-menu button svg{width:17px;height:17px;color:var(--verde-sucuriu);flex-shrink:0}
.export-menu button small{display:block;font-size:10.5px;font-weight:600;color:var(--ink-soft)}
.export-busy{display:flex;align-items:center;gap:8px;padding:9px 11px;font-size:12.5px;color:var(--ink-soft)}

/* ===================== KPI CARDS ===================== */
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:20px}
.kpi{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  padding:16px 18px;box-shadow:var(--shadow-sm);position:relative;overflow:hidden;
  transition:transform .18s ease,box-shadow .18s ease;
}
.kpi:hover{transform:translateY(-2px);box-shadow:var(--shadow-md)}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--verde-sucuriu)}
.kpi[data-tone="warn"]::before{background:var(--naranjo)}
.kpi[data-tone="alto"]::before{background:var(--risco-alto)}
.kpi[data-tone="info"]::before{background:var(--eco-verde)}
.kpi__top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.kpi__ic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;
  background:rgba(114,128,70,.12);color:var(--verde-sucuriu)}
.kpi[data-tone="warn"] .kpi__ic{background:rgba(234,118,0,.13);color:var(--naranjo)}
.kpi[data-tone="alto"] .kpi__ic{background:rgba(192,57,43,.12);color:var(--risco-alto)}
.kpi[data-tone="info"] .kpi__ic{background:rgba(191,184,0,.14);color:#8a850a}
.kpi__ic svg{width:19px;height:19px}
.kpi__trend{font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:20px}
.kpi__trend.up{color:var(--risco-alto);background:rgba(192,57,43,.1)}
.kpi__trend.down{color:var(--verde-sucuriu);background:rgba(114,128,70,.12)}
.kpi__trend.flat{color:var(--ink-soft);background:var(--surface-2)}
.kpi__val{font-size:26px;font-weight:800;letter-spacing:-.02em;line-height:1}
.kpi__val small{font-size:14px;font-weight:700;color:var(--ink-soft)}
.kpi__label{font-size:12px;color:var(--ink-soft);font-weight:600;margin-top:4px}

/* ===================== PANELS / CHARTS ===================== */
.grid-2{display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:16px;margin-bottom:16px}
.panel{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow-sm);overflow:hidden;
}
.panel__head{
  display:flex;align-items:center;justify-content:space-between;
  padding:15px 18px 10px;
}
.panel__head h3{font-size:14px;display:flex;align-items:center;gap:9px;color:var(--verde-sucuriu)}
.panel__head h3 svg{width:17px;height:17px;color:var(--verde-sucuriu)}
.panel__sub{font-size:11.5px;color:var(--ink-soft);font-weight:600}
.panel__body{padding:6px 10px 14px}
.panel__total{
  font-size:11.5px;color:var(--ink-soft);font-weight:700;
  padding:0 18px 12px;
}
.panel__total b{color:var(--ink);font-size:14px}

/* ===================== INSIGHTS ===================== */
.insight-card{
  background:linear-gradient(135deg,var(--surface),var(--surface-2));
  border:1px solid var(--line);border-radius:var(--radius);
  padding:18px 20px;margin-bottom:16px;box-shadow:var(--shadow-sm);
  position:relative;
}
.insight-card__head{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.insight-card__head .bulb{
  width:34px;height:34px;border-radius:9px;display:grid;place-items:center;
  background:rgba(243,208,28,.18);color:var(--amarelo-arauco);flex-shrink:0;
}
html[data-theme="dark"] .insight-card__head .bulb{color:#F3D01C}
.insight-card__head .bulb svg{width:19px;height:19px}
.insight-card__head h3{font-size:15px}
.insight-card__head p{font-size:11.5px;color:var(--ink-soft)}
.insight-list{display:flex;flex-direction:column;gap:10px}
.insight{
  display:flex;gap:12px;padding:12px 14px;border-radius:var(--radius-sm);
  background:var(--surface);border:1px solid var(--line);
  border-left:3px solid var(--verde-sucuriu);
}
.insight[data-sev="alto"]{border-left-color:var(--risco-alto);background:rgba(192,57,43,.03)}
.insight[data-sev="medio"]{border-left-color:var(--naranjo);background:rgba(234,118,0,.03)}
.insight[data-sev="info"]{border-left-color:var(--eco-verde)}
.insight__ic{flex-shrink:0;width:30px;height:30px;border-radius:8px;display:grid;place-items:center;
  background:rgba(114,128,70,.1);color:var(--verde-sucuriu)}
.insight[data-sev="alto"] .insight__ic{background:rgba(192,57,43,.1);color:var(--risco-alto)}

    t.style.cssText='position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:11px 20px;border-radius:10px;font-weight:700;font-size:13px;z-index:200;box-shadow:var(--shadow-lg);transition:opacity .3s';
    document.body.appendChild(t);}
  t.textContent=msg; t.style.opacity='1'; clearTimeout(t._t); t._t=setTimeout(()=>t.style.opacity='0',2600);
}

/* ============================================================
   INGESTÃO DE ARQUIVOS XLSX
   ============================================================ */
const COLMAP = {
  data:['data'], motorista:['motorista','condutor'], ign:['ign.','ign','ignicao','ignição'],
  vel:['vel.','vel','velocidade'], odom:['odom.','odom','odometro','odômetro','hodometro'],
  lat:['latitude','lat'], lon:['longitude','lon','lng'], endereco:['endereço','endereco','local'],
  origem:['origem'], rotulo:['rótulo','rotulo']
};
function findCol(headers, keys){
  const H = headers.map(h=>String(h||'').trim().toLowerCase());
  for(const k of keys){ const i=H.indexOf(k); if(i>=0) return i; }
  for(const k of keys){ const i=H.findIndex(h=>h.includes(k)); if(i>=0) return i; }
  return -1;
}
async function ingestFile(file){
  const buf = await file.arrayBuffer();
  const wb = XLSX.read(buf,{type:'array',cellDates:true});
  const ws = wb.Sheets[wb.SheetNames[0]];
  const aoa = XLSX.utils.sheet_to_json(ws,{header:1,defval:null});
  // localizar linha de cabeçalho (a que contém "Data" e "Motorista"/"Vel")
  let hIdx = 0;
  for(let i=0;i<Math.min(aoa.length,15);i++){
    const row = aoa[i].map(c=>String(c||'').toLowerCase());
    if(row.includes('data') && (row.some(c=>c.includes('vel'))||row.includes('motorista'))){ hIdx=i; break; }
  }
  const headers = aoa[hIdx]||[];
  const col = {};
  for(const k in COLMAP) col[k]=findCol(headers,COLMAP[k]);
  const plate = plateFromName(file.name);
  const rows = [];
  for(let i=hIdx+1;i<aoa.length;i++){
    const r = aoa[i]; if(!r) continue;
    const d = parseDate(r[col.data]);
    if(!d || isNaN(d)) continue; // pula rodapés/linhas inválidas
    rows.push({
      plate,
      data:d,
      ts:d.getTime(),
      motorista: (r[col.motorista]!=null && String(r[col.motorista]).trim()) ? String(r[col.motorista]).trim() : 'Não informado',
      ign: String(r[col.ign]||'').trim().toUpperCase(),
      vel: toNum(r[col.vel]),
      odom: toNum(r[col.odom]),
      lat: toNum(r[col.lat]),
      lon: toNum(r[col.lon]),
      endereco: r[col.endereco]!=null ? String(r[col.endereco]).trim() : '',
      via: extractVia(r[col.endereco])
    });
  }
  return { plate, name:file.name, rows };
}

/* Consolida todos os arquivos em S.rows */
function rebuildDataset(){
  S.rows = [];
  S.files.forEach(f=>{ f.rows.forEach(r=>S.rows.push(r)); });
  S.rows.sort((a,b)=>a.ts-b.ts);
  // deriva limite e tolerância aplicáveis a cada registro
  // Map de limites: O(1) por registro (o find linear degradava em bases grandes).
  // Semântica preservada: via cadastrada SEM limite retorna null (não cai no padrão).
  const lmap=new Map();
  S.limits.forEach(l=>{ if(l.via){ const k=l.via.toUpperCase(); if(!lmap.has(k)) lmap.set(k,l); } }); // primeira via duplicada vence, como no find() original
  S.rows.forEach(r=>{
    const L=r.via?lmap.get(r.via.toUpperCase()):undefined;
    r.limite = L!==undefined ? L.limite : S.defaultLimit;
    r.tolSeg = (L&&L.tolSeg!=null) ? L.tolSeg : 5;
  });
  // gap (s) até o próximo registro da mesma placa e se ele também está acima do limite
  const nextByPlate = {};
  for(let i=S.rows.length-1;i>=0;i--){
    const r=S.rows[i], nx=nextByPlate[r.plate];
    r.gapNext = nx ? (nx.ts-r.ts)/1000 : null;
    r.nextOver = nx ? (nx.limite!=null && nx.ign==='ON' && nx.vel>0 && nx.vel>nx.limite) : false;
    nextByPlate[r.plate]=r;
  }
}

/* Critério ÚNICO de violação (usado em KPIs, tabelas, insights e exports):
   registro em movimento acima do limite da via, desconsiderando excursões
   comprovadamente mais curtas que a tolerância (o ponto seguinte da mesma
   placa, dentro da janela de tolerância, já voltou ao limite). Com telemetria
   de granularidade em minutos o comportamento é idêntico ao anterior. */
function isViol(r){
  if(!(r.ign==='ON' && r.vel>0 && r.limite!=null && r.vel>r.limite)) return false;
  const tol = r.tolSeg??5;
  if(r.gapNext==null) return true;      // último ponto da placa: não há como descartar
  if(r.gapNext>=tol) return true;       // excursão durou pelo menos a tolerância
  return !!r.nextOver;                  // ponto seguinte (antes da tolerância) segue acima
}

/* ============================================================
   MOTOR DE FILTROS
   ============================================================ */
function applyFilters(){
  const f = S.filters;
  const ign = f.ign===undefined ? 'ON' : f.ign; // default ON
  S.filtered = S.rows.filter(r=>{
    if(f.dataIni && r.ts < f.dataIni) return false;
    if(f.dataFim && r.ts > f.dataFim) return false;
    if(f.horaIni!=null || f.horaFim!=null){
      const sec = r.data.getHours()*3600+r.data.getMinutes()*60+r.data.getSeconds();
      if(f.horaIni!=null && sec < f.horaIni) return false;
      if(f.horaFim!=null && sec > f.horaFim) return false;
    }
    if(ign && r.ign!==ign) return false;
    if(f.plates && f.plates.length && !f.plates.includes(r.plate)) return false;
    if(f.drivers && f.drivers.length && !f.drivers.includes(r.motorista)) return false;
    if(f.velMin!=null && !(r.vel>=f.velMin)) return false;
    if(f.velMax!=null && !(r.vel<=f.velMax)) return false;
    if(f.vias && f.vias.length && !f.vias.includes(r.via)) return false;
    // ---- cross-filter (estilo Power BI): dimensões selecionadas em gráficos ----
    if(!matchesXF(r)) return false;
    return true;
  });
}

/* ============================================================
   CROSS-FILTER — dimensões clicáveis (estilo Power BI)
   S.xf = { dimKey: valor, ... } — múltiplas dimensões combináveis
   ============================================================ */
function xfValue(r, dim){
  switch(dim){
    case 'condutor': return r.motorista;
    case 'via': return r.via||'Vias urbanas / outras';
    case 'faixa': return faixaDe(r.vel);
    case 'dia': return fmtDateOnly(r.data);
    case 'hora': return r.data.getHours()+'h';
    case 'mesano': return mesAno(r.data);
    case 'placa': return r.plate;
    default: return null;
  }
}
function matchesXF(r){
  const xf = S.xf||{};
  for(const dim in xf){
    if(xf[dim]==null) continue;
    if(xfValue(r,dim)!==xf[dim]) return false;
  }
  return true;
}
function faixaDe(v){
  if(v==null||isNaN(v))return null;
  if(v<=40)return'0–40'; if(v<=60)return'41–60'; if(v<=80)return'61–80';
  if(v<=100)return'81–100'; if(v<=120)return'101–120'; return'>120';
}
function setXF(dim,val){
  S.xf = S.xf||{};
  if(S.xf[dim]===val) delete S.xf[dim]; // clicar de novo remove
  else S.xf[dim]=val;
  applyFilters();
  renderView();
}
function clearXF(dim){ if(S.xf){ if(dim) delete S.xf[dim]; else S.xf={}; } applyFilters(); renderView(); }
function xfLabel(dim){
  return {condutor:'Condutor',via:'Via',faixa:'Faixa de vel.',dia:'Dia',hora:'Hora',mesano:'Mês/Ano',placa:'Placa'}[dim]||dim;
}
function xfBar(){
  const xf=S.xf||{}; const keys=Object.keys(xf).filter(k=>xf[k]!=null);
  if(!keys.length) return '';
  return `<div class="xf-bar">
    <span class="xf-bar__label">${svg('layers')} Filtros ativos por seleção</span>
    ${keys.map(k=>`<span class="xf-chip"><span class="k">${xfLabel(k)}:</span> ${xf[k]}
      <button data-xfdel="${k}" title="Remover">${svg('x')}</button></span>`).join('')}
    <button class="xf-clear" id="xfClearAll">Limpar seleções</button>
  </div>`;
}
function bindXFBar(){
  $$('[data-xfdel]').forEach(b=>b.onclick=()=>clearXF(b.dataset.xfdel));
  $('#xfClearAll') && ($('#xfClearAll').onclick=()=>clearXF());
}

/* Subconjunto "em movimento" para análises de velocidade */
function moving(rows){ return rows.filter(r=>r.ign==='ON' && r.vel>0); }

/* Detecta violações: critério único com tolerância (ver isViol) */
function violations(rows){
  return rows.filter(isViol); // isViol já exige Ign. ON e Vel. > 0
}

/* KM rodado por placa no conjunto (odom max - min) */
function kmByPlate(rows){
  const map = {};
  rows.forEach(r=>{
    if(isNaN(r.odom)) return;
    if(!map[r.plate]) map[r.plate]={min:r.odom,max:r.odom,driver:{}};
    map[r.plate].min=Math.min(map[r.plate].min,r.odom);
    map[r.plate].max=Math.max(map[r.plate].max,r.odom);
    if(r.ign==='ON'&&r.vel>0) map[r.plate].driver[r.motorista]=(map[r.plate].driver[r.motorista]||0)+1;
  });
  const out={};
  for(const p in map){
    const topDriver = Object.entries(map[p].driver).sort((a,b)=>b[1]-a[1])[0];
    out[p]={ km: map[p].max-map[p].min, driver: topDriver?topDriver[0]:'Não informado' };
  }
  return out;
}

    ${S.files.length?`<div class="file-strip">${S.files.map((f,i)=>fileChip(f,i)).join('')}</div>`:''}

function fileChip(f,i){
  return `<span class="file-chip">${svg('car')}<span class="plate">${esc(f.plate)}</span>· ${fmt(f.rows.length)} reg.
    <button data-rmfile="${i}" title="Remover">${svg('x')}</button></span>`;
}
function bindUpload(){
  const dz=$('#dropzone'), inp=$('#fileInput'), pick=$('#pickBtn');
  if(!dz) return;
  pick && (pick.onclick=()=>inp.click());
  inp && (inp.onchange=e=>handleFiles([...e.target.files]));
  ['dragenter','dragover'].forEach(ev=>dz.addEventListener(ev,e=>{e.preventDefault();dz.classList.add('drag');}));
  ['dragleave','drop'].forEach(ev=>dz.addEventListener(ev,e=>{e.preventDefault();dz.classList.remove('drag');}));
  dz.addEventListener('drop',e=>handleFiles([...e.dataTransfer.files]));
  $$('[data-rmfile]').forEach(b=>b.onclick=()=>{ S.files.splice(+b.dataset.rmfile,1); rebuildDataset(); persist(); renderView(); updateTopMeta(); });
}
async function handleFiles(fileList){
  const xlsx = fileList.filter(f=>/\.xls[xm]?$/i.test(f.name));
  const jsons = fileList.filter(f=>/\.json$/i.test(f.name));
  if(!xlsx.length && !jsons.length){ toast('Selecione arquivos .xlsx ou um backup .json'); return; }
  // backup JSON restaura o estado completo (dados + limites + cadastros)
  for(const jf of jsons){
    try{
      const obj=JSON.parse(await jf.text());
      importJson(obj);
      toast('Backup restaurado: '+jf.name);
    }catch(err){ console.error(err); toast('JSON inválido: '+jf.name); }
  }
  if(xlsx.length) toast('Processando '+xlsx.length+' arquivo(s)...');
  for(const file of xlsx){
    try{
      const parsed = await ingestFile(file);
      if(!parsed.rows.length){ toast('Sem registros válidos em '+file.name); continue; }
      // substitui se já existe mesma placa+nome
      const idx = S.files.findIndex(f=>f.name===parsed.name);
      if(idx>=0) S.files[idx]=parsed; else S.files.push(parsed);
    }catch(err){ console.error(err); toast('Erro ao ler '+file.name); }
  }
  rebuildDataset(); autoRegisterVias(); persist();
  updateTopMeta();
  if(S.rows.length){ go('visao'); toast(fmt(S.rows.length)+' registros carregados'); }
  else renderView();
}
/* pré-registra vias detectadas para o usuário definir limites */
function autoRegisterVias(){
  const vias = [...new Set(S.rows.map(r=>r.via).filter(Boolean))];
  vias.forEach(v=>{ if(!S.limits.find(l=>l.via===v)) S.limits.push({via:v,limite:null,tolSeg:5}); });
}

function isoLocal(d){ return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }

/* Componente de filtro multi-seleção padronizado: Todos / Limpar / Buscar / caixas */
function msControl(key,label,items,selected){
  const sel=new Set(selected||[]);
  return `<div class="field ms" data-ms="${key}">
    <label>${label}</label>
    <button type="button" class="ms-btn"><span class="ms-summary">Todos</span>${svg('chev')}</button>
    <div class="ms-pop hidden">
      <div class="ms-actions"><button type="button" data-msall>Todos</button><button type="button" data-msclear>Limpar</button></div>
      <div class="ms-search">${svg('search')}<input type="text" placeholder="Buscar..."></div>
      <div class="ms-list">
        ${items.length?items.map(it=>`<label><input type="checkbox" value="${esc(it.value)}" ${sel.has(it.value)?'checked':''}><span>${esc(it.label)}</span></label>`).join(''):'<div class="ms-empty">Sem opções.</div>'}
      </div>
    </div>
  </div>`;
}
function msSelected(key){ return $$(`.ms[data-ms="${key}"] .ms-list input:checked`).map(i=>i.value); }
function updateMsSummary(ms){
  const sum=ms.querySelector('.ms-summary'); if(!sum) return;
  const checked=[...ms.querySelectorAll('.ms-list input:checked')];
  const total=ms.querySelectorAll('.ms-list input').length;
  if(checked.length===0||checked.length===total) sum.textContent='Todos';
  else if(checked.length===1) sum.textContent=checked[0].parentElement.querySelector('span').textContent;
  else sum.textContent=checked.length+' selecionados';
}
function bindMultiselects(){
  $$('.ms').forEach(ms=>{
    const btn=ms.querySelector('.ms-btn');
    const pop=ms.querySelector('.ms-pop');
    const list=ms.querySelector('.ms-list');
    btn.onclick=e=>{ e.stopPropagation(); const willOpen=pop.classList.contains('hidden'); closeAllPops(); if(willOpen) pop.classList.remove('hidden'); };
    const all=ms.querySelector('[data-msall]'), clr=ms.querySelector('[data-msclear]');
    if(all) all.onclick=e=>{ e.preventDefault(); list.querySelectorAll('input').forEach(cb=>{ if(cb.parentElement.style.display!=='none') cb.checked=true; }); updateMsSummary(ms); };
    if(clr) clr.onclick=e=>{ e.preventDefault(); list.querySelectorAll('input').forEach(cb=>cb.checked=false); updateMsSummary(ms); };
    const search=ms.querySelector('.ms-search input');
    if(search) search.oninput=()=>{ const q=search.value.toLowerCase(); list.querySelectorAll('label').forEach(l=>{ l.style.display=l.textContent.toLowerCase().includes(q)?'':'none'; }); };
    list.querySelectorAll('input').forEach(cb=>cb.addEventListener('change',()=>{ updateMsSummary(ms); }));
    updateMsSummary(ms);
  });
}
function closeAllPops(){ $$('.ms-pop,.period-pop').forEach(p=>p.classList.add('hidden')); S._periodOpen=false; }
function bindOutsideClose(){
  if(window.__popOutside) return; window.__popOutside=true;
  document.addEventListener('click',ev=>{
    $$('.period-pop:not(.hidden)').forEach(p=>{ const w=p.closest('.field-wrap'); if(w&&!w.contains(ev.target)){ p.classList.add('hidden'); S._periodOpen=false; } });
    $$('.ms-pop:not(.hidden)').forEach(p=>{ const w=p.closest('.ms'); if(w&&!w.contains(ev.target)) p.classList.add('hidden'); });
    const em=$('#exportMenu'); if(em&&!em.classList.contains('hidden')){ const w=$('#exportWrap'); if(w&&!w.contains(ev.target)) em.classList.add('hidden'); }
  });
}

function bindFilterBar(afterApply){
  const g=id=>$('#'+id);
  bindMultiselects();
  const apply=()=>{
    const f=S.filters;
    f._dataIni=g('fDataIni').value; f._dataFim=g('fDataFim').value;
    f._horaIni=g('fHoraIni').value; f._horaFim=g('fHoraFim').value;
    f.dataIni = f._dataIni?new Date(f._dataIni+'T00:00:00').getTime():null;
    f.dataFim = f._dataFim?new Date(f._dataFim+'T23:59:59').getTime():null;
    f.horaIni = f._horaIni?horaToSec(f._horaIni):null;
    f.horaFim = f._horaFim?horaToSec(f._horaFim):null;
    f.plates = msSelected('plates'); f.drivers = msSelected('drivers');
    f.vias = msSelected('vias');
    // Ignição em checkbox: 1 marcada filtra por ela; 0 ou 2 marcadas significam ambas.
    const ignSel = msSelected('ign'); f.ign = ignSel.length===1 ? ignSel[0] : '';
    f._velMin=g('fVelMin').value; f._velMax=g('fVelMax').value;
    f.velMin = f._velMin!==''?+f._velMin:null; f.velMax = f._velMax!==''?+f._velMax:null;
    applyFilters(); afterApply&&afterApply();
  };
  // popover período: sem botão aplicar, a escolha das datas aplica sozinha
  const pop=g('periodPop'), pbtn=g('periodBtn');
  if(pbtn){
    pbtn.onclick=e=>{ e.stopPropagation(); const willOpen=pop.classList.contains('hidden'); closeAllPops(); if(willOpen){ pop.classList.remove('hidden'); S._periodOpen=true; } };
    g('fDataIni').addEventListener('change',apply);
    g('fDataFim').addEventListener('change',apply);
    g('periodReset').onclick=()=>{ g('fDataIni').value=''; g('fDataFim').value=''; apply(); };
  }
  g('fApply').onclick=apply;
  g('fClear').onclick=()=>{ S.filters={ign:'ON'}; S.xf={}; S._periodOpen=false; applyFilters(); renderView(); };
  // reabre o popover de período se ele estava aberto antes do re-render disparado pelo apply
  if(S._periodOpen && pop) pop.classList.remove('hidden');
}
function horaToSec(hhmmss){
  const p=hhmmss.split(':').map(Number);
  return (p[0]||0)*3600+(p[1]||0)*60+(p[2]||0);
}
function fcountTxt(){
  return `${fmt(S.filtered.length)} de ${fmt(S.rows.length)} registros`;
}

/* ============================================================
   HELPERS DE GRÁFICO (ApexCharts + paleta Arauco)
   ============================================================ */
const PALETTE = ['#728046','#EA7600','#BFB800','#F3D01C','#696158','#F4BA80','#DFD1A7','#DFDB80'];
function chartTheme(){
  const dark = S.theme==='dark';
  return {
    ink: dark?'#ECEDE4':'#2B2A26',
    soft: dark?'#A9AB9E':'#5E5B52',
    grid: dark?'#3A3D34':'#E4E5DC',
    mode: dark?'dark':'light'
  };
}
function mkChart(el, opt, xfDim, xfCats){
  const t=chartTheme();
  const dark=S.theme==='dark';
  const base={
    chart:{
      fontFamily:'inherit',foreColor:t.soft,background:'transparent',
      toolbar:{show:false},
      animations:{easing:'easeinout',speed:450},
      events:{}
    },
    theme:{mode:t.mode},
    colors:PALETTE,
    grid:{show:false,padding:{left:6,right:6,top:0,bottom:0}},
    dataLabels:{
      enabled:true,
      style:{fontSize:'12px',fontWeight:800,colors:[dark?'#ECEDE4':'#2B2A26']},
      background:{enabled:false},
      dropShadow:{enabled:false}
    },
    xaxis:{axisBorder:{show:false},axisTicks:{show:false},labels:{style:{colors:t.soft,fontSize:'11px'}}},
    yaxis:{show:false,labels:{show:false}},
    legend:{labels:{colors:t.soft},fontSize:'12px'},
    tooltip:{theme:t.mode}
  };
  // cross-filter: liga clique no ponto à dimensão
  if(xfDim && xfCats){
    base.chart.events.dataPointSelection = function(ev,ctx,cfg){
      const i=cfg.dataPointIndex;
      const val = xfCats[i];
      if(val!=null) setXF(xfDim, val);
    };
    base.states={active:{filter:{type:'darken',value:.75}}};
  }
  const merged=deepMerge(base,opt);
  const ch=new ApexCharts(el,merged); ch.render(); return ch;
}
function deepMerge(a,b){
  const out={...a};
  for(const k in b){
    if(b[k]&&typeof b[k]==='object'&&!Array.isArray(b[k])) out[k]=deepMerge(a[k]||{},b[k]);
    else out[k]=b[k];
  } return out;
}

/* ============================================================
   ORDENAÇÃO GENÉRICA DE TABELAS — clique no cabeçalho alterna
   crescente/decrescente (números, datas via data-sv; texto A–Z/Z–A pt-BR)
   ============================================================ */
function makeSortable(tbl, skipCols){
  if(!tbl) return;
  const skip=new Set(skipCols||[]);
  const ths=[...tbl.querySelectorAll('thead th')];
  ths.forEach((th,ci)=>{
    if(skip.has(ci)) return;
    th.classList.add('th-sort');
    th.title='Clique para ordenar';
    let ar=th.querySelector('.sort-ar');
    if(!ar){ ar=document.createElement('span'); ar.className='sort-ar'; ar.textContent='▼'; ar.style.color='var(--line-strong)'; th.appendChild(ar); }
    th.addEventListener('click',()=>{
      const dir = th.dataset.dir==='asc'?'desc':'asc';
      ths.forEach(o=>{ delete o.dataset.dir; const a=o.querySelector('.sort-ar'); if(a){ a.textContent='▼'; a.style.color='var(--line-strong)'; } });
      th.dataset.dir=dir; ar.textContent=dir==='asc'?'▲':'▼'; ar.style.color='var(--verde-sucuriu)';
      const tb=tbl.querySelector('tbody');
      const rows=[...tb.querySelectorAll(':scope > tr')].filter(r=>r.children.length>1); // ignora a linha de estado vazio
      const val=tr=>{
        const td=tr.children[ci]; if(!td) return '';
        if(td.dataset.sv!==undefined) return +td.dataset.sv; // valor bruto p/ números, datas e durações
        return td.textContent.trim();
      };
      rows.sort((a,b)=>{
        let x=val(a), y=val(b);
        if(typeof x==='number' && typeof y==='number') return dir==='asc'? x-y : y-x;
        x=String(x).toLowerCase(); y=String(y).toLowerCase();
        return dir==='asc'? x.localeCompare(y,'pt-BR') : y.localeCompare(x,'pt-BR');
      });
      rows.forEach(r=>tb.appendChild(r));
    });
  });
}

function kpi(ic,label,val,trend,tone,sub,kpiKey){

/* ============================================================
   PICO DE VELOCIDADE — DETALHAMENTO EM TELA CHEIA
   ============================================================ */
function openPeakFullscreen(peak, mov){
  // contexto: registros próximos no tempo, do mesmo veículo (evidência do fato)
  const janela = mov.filter(r=>r.plate===peak.plate)
    .sort((a,b)=>a.ts-b.ts);
  const idx = janela.findIndex(r=>r.ts===peak.ts && r.vel===peak.vel);
  const ctx = janela.slice(Math.max(0,idx-6), idx+7);
  const gmaps=(peak.lat&&peak.lon)?`https://www.google.com/maps?q=${peak.lat},${peak.lon}`:null;
  const overLim = peak.limite!=null && peak.vel>peak.limite;

  const html=`<div class="fs-modal">
    <div class="fs-modal__head">
      <div>
        <div class="fs-eyebrow">${svg('speed')} EVIDÊNCIA · PICO DE VELOCIDADE</div>
        <h2>${fmt(peak.vel)} km/h · ${esc(peak.motorista)}</h2>
        <p>${esc(peak.plate)} · ${fmtDateTime(peak.data)} · ${peak.via?esc(peak.via):'Via urbana'}</p>
      </div>
      <button class="icon-btn" data-close>${svg('x')}</button>
    </div>
    <div class="fs-modal__body">
      <div class="fs-kpis">
        ${fsKpi('VELOCIDADE REGISTRADA',fmt(peak.vel)+' km/h',overLim?'alto':'')}
        ${fsKpi('LIMITE DA VIA',peak.limite!=null?fmt(peak.limite)+' km/h':'não definido','')}
        ${fsKpi('EXCESSO',overLim?'+'+fmt(peak.vel-peak.limite)+' km/h':'—',overLim?'alto':'ok')}
        ${fsKpi('LOCALIZAÇÃO',peak.lat&&peak.lon?`${peak.lat.toFixed(5)}, ${peak.lon.toFixed(5)}`:'—','')}
      </div>
      <div class="fs-endereco">
        ${svg('pin')} <span>${peak.endereco?esc(peak.endereco):'Endereço não informado'}</span>
        ${gmaps?`<a class="btn btn--sm" href="${gmaps}" target="_blank" rel="noopener">${svg('map')} Abrir no mapa</a>`:''}
      </div>
      <div class="fs-tblwrap">
        <div class="fs-tbl-title">${svg('clip')} REGISTROS DE TELEMETRIA · SEQUÊNCIA DO EVENTO (${esc(peak.plate)})</div>
        <div class="tscroll" style="max-height:none;overflow-x:hidden">
          <table class="evt-table" id="evtTbl"><colgroup>
            <col style="width:15%"><col style="width:14%"><col style="width:9%"><col style="width:9%"><col style="width:6%"><col style="width:9%"><col style="width:12%"><col style="width:20%"><col style="width:6%">
          </colgroup><thead><tr>
            <th>Data / Hora</th><th>Condutor</th><th>Vel.</th><th>Limite</th><th>Ign.</th><th>Odôm.</th><th>Via</th><th>Endereço</th><th>Local</th>
          </tr></thead><tbody>
          ${ctx.map(r=>{
            const isPeak=r.ts===peak.ts&&r.vel===peak.vel;
            const over=isViol(r);
            return `<tr ${isPeak?'style="background:rgba(192,57,43,.08)"':''}>
              <td data-sv="${r.ts}" title="${fmtDateTime(r.data)}">${fmtDateTime(r.data)}${isPeak?' <span class="tag tag--alto">PICO</span>':''}</td>
              <td title="${esc(r.motorista)}">${esc(shortName(r.motorista))}</td>
              <td data-sv="${r.vel}" class="vel-cell ${over?'over':''}">${fmt(r.vel)} km/h</td>
              <td data-sv="${r.limite??-1}">${r.limite!=null?fmt(r.limite)+' km/h':'—'}</td>
              <td>${r.ign}</td><td data-sv="${isNaN(r.odom)?-1:r.odom}">${isNaN(r.odom)?'—':fmt1(r.odom)}</td>
              <td title="${esc(r.via)}">${r.via?esc(r.via):'—'}</td>

            </tr>`;

  const bg=$('#modalBg'); bg.innerHTML=html; bg.classList.add('open','fs');

  $$('[data-close]',bg).forEach(b=>b.onclick=()=>{ bg.classList.remove('open','fs'); bg.innerHTML=''; });
  bg.onclick=e=>{ if(e.target===bg){ bg.classList.remove('open','fs'); bg.innerHTML=''; } };
}

function shortName(n){ if(typeof n!=='string')return n; const p=n.trim().split(/\s+/); return p.length>1?p[0]+' '+p[1]:p[0]; }
function drawCond(id,mov){
  const by={}; mov.forEach(r=>by[r.motorista]=(by[r.motorista]||0)+1);
  const arr=Object.entries(by).sort((a,b)=>b[1]-a[1]); // TODOS os condutores
  const maxVal=arr.length?arr[0][1]:1;
  // reserva à direita proporcional ao tamanho do maior valor (nunca sobrepõe a barra)
  const reserva=Math.min(30, 8+String(fmt(maxVal)).length*2.6); // teto 30%: cobre até 7 dígitos em pista de 280px
  const sel=(S.xf||{}).condutor;
  const el=$('#'+id);
  el.innerHTML=`<div class="hbar-list">${arr.map(([name,n],i)=>{
    const w=(n/maxVal*(100-reserva));      // barra mais longa deixa a reserva livre p/ o valor
    const active=sel===name;
    return `<button class="hbar ${sel&&!active?'dim':''} ${active?'active':''}" data-cond="${esc(name)}" title="${esc(name)} · ${fmt(n)} registros">
      <span class="hbar__name">${esc(shortName(name))}</span>
      <span class="hbar__track">
        <span class="hbar__fill" style="width:${w.toFixed(2)}%;background:${PALETTE[i%PALETTE.length]}"></span>
        <span class="hbar__val" style="left:calc(${w.toFixed(2)}% + 8px)">${fmt(n)}</span>
      </span>
    </button>`;}).join('')||'<div class="center-empty">Sem registros em movimento.</div>'}</div>`;
  $$('.hbar',el).forEach(b=>b.onclick=()=>setXF('condutor',b.dataset.cond));
  // adaptador com a mesma interface do ApexCharts (dataURI/destroy):
  // desenha o gráfico em canvas para os exports PDF/PPT continuarem funcionando
  S.charts.cond?.destroy?.();
  S.charts.cond=condCanvasAdapter(arr);
}
/* Renderiza o gráfico de condutores em canvas (nome, barra, valor na ponta) p/ exportação */
function condCanvasAdapter(arr){
  return {
    destroy(){},
    dataURI:async(opt)=>{
      const sc=(opt&&opt.scale)||3;
      const W=760,rowH=30,top=14,nameW=180,valW=70,padR=14;
      const H=top*2+Math.max(1,arr.length)*rowH;
      const cv=document.createElement('canvas'); cv.width=W*sc; cv.height=H*sc;
      const g=cv.getContext('2d'); g.scale(sc,sc);
      g.fillStyle='#FFFFFF'; g.fillRect(0,0,W,H);
      const maxVal=arr.length?arr[0][1]:1;
      const barMax=W-nameW-valW-padR;
      g.textBaseline='middle';
      arr.forEach(([name,n],i)=>{
        const y=top+i*rowH;
        g.fillStyle='#2B2A26'; g.font='600 11px Helvetica,Arial';
        g.fillText(shortName(name).slice(0,30),8,y+rowH/2);
        const bw=Math.max(3,n/maxVal*barMax);
        g.fillStyle=PALETTE[i%PALETTE.length];
        if(g.roundRect){ g.beginPath(); g.roundRect(nameW,y+6,bw,rowH-12,4); g.fill(); }
        else g.fillRect(nameW,y+6,bw,rowH-12);
        g.fillStyle='#2B2A26'; g.font='700 11px Helvetica,Arial';
        g.fillText(fmt(n),nameW+bw+8,y+rowH/2);
      });
      return {imgURI:cv.toDataURL('image/png')};
    }
  };
}

/* Tempo estimado acima do limite, por condutor (soma de intervalos entre registros consecutivos em violação) */
function tempoAcimaLimitePorCondutor(mov){
  const out={};
  const byPlateCond={};
  mov.forEach(r=>{ const k=r.plate+'|'+r.motorista; (byPlateCond[k]=byPlateCond[k]||[]).push(r); });
  for(const k in byPlateCond){
    const list=byPlateCond[k].sort((a,b)=>a.ts-b.ts);
    const cond=k.split('|')[1];
    for(let i=0;i<list.length-1;i++){
      const cur=list[i], nxt=list[i+1];
      const over = isViol(cur);
      if(over){
        const gap=(nxt.ts-cur.ts)/1000; // segundos
        // só soma se o intervalo for razoável (< 10 min), senão conta a tolerância
        if(gap>0 && gap<=600){ out[cond]=(out[cond]||0)+gap; }
      }
    }
  }
  return out;
}
function formatDur(seg){
  seg=Math.round(seg);
  if(seg<60) return seg+'s';
  const m=Math.floor(seg/60), s=seg%60;
  if(m<60) return `${m}min ${s}s`;
  const h=Math.floor(m/60), mm=m%60;
  return `${h}h ${mm}min`;
}

/* Motor heurístico de insights */
function buildInsights(all,mov,viol){
  const out=[];
  if(!mov.length){ return [{sev:'info',ic:'eye',badge:'sem dados',txt:'Não há registros em movimento no recorte selecionado.'}]; }
  const velMed=mov.reduce((s,r)=>s+r.vel,0)/mov.length;
  const pctViol=viol.length/mov.length*100;

  // 1. violações por condutor recorrente
  const byC={}; viol.forEach(r=>byC[r.motorista]=(byC[r.motorista]||0)+1);
  const topC=Object.entries(byC).sort((a,b)=>b[1]-a[1])[0];
  if(topC && topC[1]>=3){
    out.push({sev:'alto',ic:'alert',badge:'recorrência',
      txt:`O condutor <b>${esc(topC[0])}</b> concentra <b>${topC[1]}</b> registros acima do limite, indicando comportamento recorrente que demanda tratativa de gestão de consequências.`});
  }
  // 2. via mais crítica
  const byV={}; viol.forEach(r=>{ const v=r.via||'via urbana'; byV[v]=(byV[v]||0)+1; });
  const topV=Object.entries(byV).sort((a,b)=>b[1]-a[1])[0];
  if(topV){
    out.push({sev:'medio',ic:'map',badge:'concentração',
      txt:`A via <b>${esc(topV[0])}</b> concentra a maior parte das violações (<b>${topV[1]}</b> ocorrências), sugerindo trecho de atenção prioritária para fiscalização.`});
  }
  // 3. pico de velocidade
  const peak=mov.reduce((m,r)=>r.vel>m.vel?r:m,mov[0]);
  if(peak.limite!=null && peak.vel>peak.limite){
    out.push({sev:'alto',ic:'speed',badge:'pico',
      txt:`Pico de <b>${fmt(peak.vel)} km/h</b> registrado por <b>${esc(peak.motorista)}</b> em ${fmtDateTime(peak.data)}${peak.via?` na ${esc(peak.via)}`:''}, <b>${fmt(peak.vel-peak.limite)} km/h acima</b> do limite de ${fmt(peak.limite)} km/h.`});
  }
  // 4. horário crítico
  const byH=Array.from({length:24},()=>0); viol.forEach(r=>byH[r.data.getHours()]++);
  const maxH=byH.indexOf(Math.max(...byH));
  if(byH[maxH]>=2){
    out.push({sev:'medio',ic:'clock',badge:'temporal',
      txt:`Há concentração de violações no intervalo das <b>${maxH}h</b>, o que pode estar associado a picos de operação ou fadiga do condutor nesse período.`});
  }
  // 4b. qualidade de dados: velocidades fisicamente improváveis (possível falha de GPS)
  const suspects=mov.filter(r=>r.vel>160);
  if(suspects.length){
    out.push({sev:'medio',ic:'eye',badge:'qualidade de dados',
      txt:`Foram identificados <b>${fmt(suspects.length)}</b> registro(s) com velocidade acima de <b>160 km/h</b>, valor pouco provável para a operação. Recomenda-se validar possível falha de leitura do GPS antes de usar esses pontos como evidência.`});
  }
  // 4c. qualidade de dados: variação implausível de odômetro (sinaliza, não exclui)
  const odomAnom=odometroAnomalias(all);
  if(odomAnom.length){
    const ex=odomAnom[0];
    const desc = ex.delta<0
      ? `regressão de ${fmt1(Math.abs(ex.delta))} km`
      : `salto de ${fmt1(ex.delta)} km em ${formatDur(ex.gap)}`;
    out.push({sev:'medio',ic:'route',badge:'qualidade de dados',
      txt:`Foram identificados <b>${fmt(odomAnom.length)}</b> intervalo(s) com variação implausível de odômetro (ex.: <b>${esc(ex.plate)}</b>, ${desc}, em ${fmtDateTime(ex.data)}). Nenhum registro foi excluído, mas o <b>km rodado</b> (diferença entre máximo e mínimo do odômetro) pode estar inflado por esses pontos. Recomenda-se validar a leitura do equipamento antes de usar o km como evidência.`});
  }
  // 5. panorama geral
  out.push({sev:pctViol>=15?'alto':pctViol>0?'medio':'info',ic:'trend',badge:'panorama',
    txt:`No recorte atual, <b>${pctViol.toFixed(1)}%</b> dos registros em movimento estão acima do limite, com velocidade média de <b>${fmt1(velMed)} km/h</b>.`});
  // 6. km próximo do teto (monitorados)
  const kmMap=kmByPlate(all);
  S.kmMonitors.forEach(m=>{
    const k=kmMap[m.plate]; if(!k) return;
    const pct=k.km/m.limite*100;
    if(pct>=80) out.push({sev:pct>=100?'alto':'medio',ic:'route',badge:'quilometragem',
      txt:`O veículo <b>${esc(m.plate)}</b> já percorreu <b>${fmt1(k.km)} km</b> (${pct.toFixed(0)}% do limite de ${fmt(m.limite)} km) no período, atenção ao teto mensal.`});
  });
  return out;
}

/* Anomalias de odômetro entre registros consecutivos da mesma placa:
   regressão (delta negativo) ou velocidade implícita > 200 km/h (heurística
   conservadora; nenhum dado é excluído, apenas sinalizado). */
function odometroAnomalias(rows){
  const byP={};
  rows.forEach(r=>{ if(!isNaN(r.odom)) (byP[r.plate]=byP[r.plate]||[]).push(r); });
  const out=[];
  for(const p in byP){
    const list=byP[p].slice().sort((a,b)=>a.ts-b.ts);
    for(let i=0;i<list.length-1;i++){
      const a=list[i], b=list[i+1];
      const delta=b.odom-a.odom, gap=(b.ts-a.ts)/1000;
      if(delta<-0.5) out.push({plate:p,delta,gap,data:b.data});
      else if(gap>0 && (delta/(gap/3600))>200) out.push({plate:p,delta,gap,data:b.data});
      else if(gap<=0 && delta>1) out.push({plate:p,delta,gap:0,data:b.data});
    }
  }
  return out;
}

function renderKm(c){
  applyFilters();
  const kmMap=kmByPlate(S.filtered);
  // dias do período selecionado
  const dmin=S.filtered[0]?.data, dmax=S.filtered[S.filtered.length-1]?.data;
  const dias=(dmin&&dmax)?Math.max(1,(dmax-dmin)/86400000):1; // fração exata de dias: km/dia sem arredondar o período

  const cards=S.kmMonitors.map(m=>{
    const k=kmMap[m.plate];
    const km=k?k.km:0, driver=k?k.driver:'—';
    const pctReal=m.limite>0? km/m.limite*100 : 0; // percentual real (pode passar de 100%)
    const pct=Math.min(100,pctReal);               // capado apenas p/ largura da barra
    const rest=m.limite-km;
    const kmDia=km/dias;
    const diasResta = kmDia>0? rest/kmDia : Infinity;
    const tone=pctReal>=100?'alto':pctReal>=80?'warn':'ok';
    const barColor=pctReal>=100?'var(--risco-alto)':pctReal>=80?'var(--naranjo)':'var(--verde-sucuriu)';
    return `<div class="km-card">
      <div class="km-card__head">
        <div><div class="km-card__plate">${esc(m.plate)}</div><div class="km-card__driver">${svg('user')} ${esc(driver)}</div></div>
        <span class="tag tag--${tone==='ok'?'ok':tone==='warn'?'medio':'alto'}">${pctReal.toFixed(0)}%</span>
      </div>
      <div class="km-bar"><div class="km-bar__fill" style="width:${pct}%;background:${barColor}"></div></div>
      <div style="display:flex;justify-content:space-between;font-size:11.5px;font-weight:600" class="muted">
        <span>${fmt1(km)} km rodados</span><span>Limite ${fmt(m.limite)} km</span></div>
      <div class="km-stats">
        <div class="km-stat"><div class="n">${fmt1(km)}</div><div class="l">Rodado</div></div>
        <div class="km-stat"><div class="n">${rest>0?fmt1(rest):'0'}</div><div class="l">Restante</div></div>
        <div class="km-stat"><div class="n">${fmt1(kmDia)}</div><div class="l">Km/dia</div></div>
      </div>
      <div class="km-eta ${tone}">${svg(tone==='alto'?'alert':'clock')}
        ${rest<=0? `Limite de ${fmt(m.limite)} km já ultrapassado no período.`
          : isFinite(diasResta)? `No ritmo atual (${fmt1(kmDia)} km/dia), atinge ${fmt(m.limite)} km em <b>~${Math.round(diasResta)} dia(s)</b>.`
          : 'Sem deslocamento no período, projeção indisponível.'}</div>
    </div>`;
  }).join('');

  c.innerHTML=filterBar()+xfBar()+`
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:10px">
    <p class="muted" style="font-size:13px;max-width:640px">Cadastre as placas monitoradas e o limite mensal em <b>Limites &amp; Config</b>. A projeção usa a média de km/dia do período filtrado.</p>
    <button class="btn btn--sm" id="addKmBtn">${svg('plus')} Cadastrar veículo</button>
  </div>
  ${S.kmMonitors.length? `<div class="km-cards">${cards}</div>`
    : `<div class="center-empty">${svg('route')}<div>Nenhum veículo cadastrado para monitoramento de KM.</div></div>`}`;

  S.exportCtx={
    title:'Monitor de KM',
    kpis:[],
    charts:[],
    tables:[{
      title:'Monitoramento de KM mensal',
      columns:['Placa','Condutor','Km rodado','Limite (km/mês)','Restante','Km/dia','% do limite'],
      rows:S.kmMonitors.map(m=>{
        const k=kmMap[m.plate]; const km=k?k.km:0; const driver=k?k.driver:'—';
        const pctReal=m.limite>0? km/m.limite*100 : 0; const rest=m.limite-km; const kmDia=km/dias;
        return [m.plate,driver,fmt1(km),fmt(m.limite),rest>0?fmt1(rest):'0',fmt1(kmDia),Math.round(pctReal)+'%'];
      })
    }]
  };

  bindFilterBar(()=>renderKm(c));
  bindXFBar();
  $('#fCount').textContent=fcountTxt();
  $('#addKmBtn').onclick=()=>go('config');
}

function th(key,label){
  const on=S.table.sort===key;
  const ar=S.table.dir==='asc'?'▲':'▼';
  return `<th data-sort="${key}" class="${on?'sorted':''}">${label}<span class="sort-ar" style="color:${on?'var(--verde-sucuriu)':'var(--line-strong)'}">${on?ar:'▼'}</span></th>`;
}
function getTableRows(){
  let rows=S.filtered.slice();
  const q=S.table.search.trim().toLowerCase();
  if(q) rows=rows.filter(r=>(r.motorista+' '+r.plate+' '+r.endereco+' '+(r.via||'')).toLowerCase().includes(q));
  const k=S.table.sort, dir=S.table.dir==='asc'?1:-1;
  rows.sort((a,b)=>{
    let x=a[k],y=b[k];
    if(k==='data'){x=a.ts;y=b.ts;}
    if(typeof x==='string'){x=x.toLowerCase();y=String(y).toLowerCase();}
    if(x==null)x=-Infinity; if(y==null)y=-Infinity;
    return x<y?-1*dir:x>y?1*dir:0;
  });
  return rows;
}
function paintTable(){
  const rows=getTableRows();
  S.exportCtx={
    title:'Registros de Telemetria',
    kpis:[{label:'Registros no recorte',value:fmt(rows.length)}],
    charts:[],
    tables:[{
      title:'Registros de telemetria',
      columns:['Data / Hora','Placa','Condutor','Ign.','Vel. (km/h)','Via','Limite','Odômetro','Endereço'],
      rows:rows.map(r=>[fmtDateTime(r.data),r.plate,r.motorista,r.ign,
        isNaN(r.vel)?'—':fmt(r.vel),r.via||'—',r.limite!=null?fmt(r.limite):'—',
        isNaN(r.odom)?'—':fmt1(r.odom),r.endereco||'—'])
    }]
  };
  const per=S.table.per, pages=Math.max(1,Math.ceil(rows.length/per));
  if(S.table.page>pages)S.table.page=pages;
  const start=(S.table.page-1)*per, slice=rows.slice(start,start+per);
  $('#regBody').innerHTML=slice.map(r=>{
    const over=isViol(r);
    return `<tr>
      <td>${fmtDateTime(r.data)}</td><td><b>${esc(r.plate)}</b></td><td>${esc(r.motorista)}</td>
      <td>${r.ign==='ON'?'<span class="tag tag--ok">ON</span>':'<span class="tag" style="background:var(--surface-2);color:var(--ink-soft)">OFF</span>'}</td>
      <td class="vel-cell ${over?'over':''}">${isNaN(r.vel)?'—':fmt(r.vel)}</td>
      <td>${r.via?esc(r.via):'—'}</td><td>${r.limite!=null?fmt(r.limite):'—'}</td>
      <td>${isNaN(r.odom)?'—':fmt1(r.odom)}</td>
      <td style="max-width:260px;overflow:hidden;text-overflow:ellipsis" title="${esc(r.endereco)}">${r.endereco?esc(r.endereco):'—'}</td>
      <td>${r.lat&&r.lon?`<button class="mini-link" data-loc='${encodeURIComponent(JSON.stringify({lat:r.lat,lon:r.lon,end:r.endereco,dt:fmtDateTime(r.data),vel:r.vel,lim:r.limite??'—',cond:r.motorista,plate:r.plate}))}'>${svg('pin')}</button>`:'—'}</td>
    </tr>`;
  }).join('')||`<tr><td colspan="10"><div class="center-empty">Nenhum registro para os filtros aplicados.</div></td></tr>`;
  $('#regInfo').textContent=`${fmt(rows.length)} registros · página ${S.table.page} de ${pages}`;
  // pager
  const pg=$('#regPager'); let h='';
  h+=`<button ${S.table.page<=1?'disabled':''} data-pg="${S.table.page-1}">‹</button>`;
  const win=[]; for(let i=Math.max(1,S.table.page-2);i<=Math.min(pages,S.table.page+2);i++)win.push(i);
  win.forEach(i=>h+=`<button class="${i===S.table.page?'active':''}" data-pg="${i}">${i}</button>`);
  h+=`<button ${S.table.page>=pages?'disabled':''} data-pg="${S.table.page+1}">›</button>`;
  pg.innerHTML=h;
  $$('[data-pg]',pg).forEach(b=>b.onclick=()=>{ S.table.page=+b.dataset.pg; paintTable(); });
  $$('[data-loc]').forEach(b=>b.onclick=()=>openLocModal(JSON.parse(decodeURIComponent(b.dataset.loc))));
}

function exportXlsx(rows){
  const data=rows.map(r=>({
    'Data':fmtDateTime(r.data),'Placa':r.plate,'Condutor':r.motorista,'Ign.':r.ign,
    'Vel. (km/h)':r.vel,'Via':r.via||'','Limite':r.limite??'','Odômetro':r.odom,
    'Latitude':r.lat,'Longitude':r.lon,'Endereço':r.endereco
  }));
  const ws=XLSX.utils.json_to_sheet(data); const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,'Telemetria');
  XLSX.writeFile(wb,`Telemetria_Logon_${new Date().toISOString().slice(0,10)}.xlsx`);
  toast('Excel exportado');
}
function exportViolations(viol){
  if(!viol.length){ toast('Sem violações para exportar'); return; }
  const data=viol.map(r=>({
    'Condutor':r.motorista,'Placa':r.plate,'Data/Hora':fmtDateTime(r.data),'Via':r.via||'',
    'Velocidade (km/h)':r.vel,'Limite (km/h)':r.limite,'Excesso (km/h)':r.vel-r.limite,
    'Latitude':r.lat,'Longitude':r.lon,'Endereço':r.endereco,
    'Google Maps':(r.lat&&r.lon)?`https://www.google.com/maps?q=${r.lat},${r.lon}`:''
  }));
  const ws=XLSX.utils.json_to_sheet(data); const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,'Violações');
  XLSX.writeFile(wb,`Evidencias_Violacoes_${new Date().toISOString().slice(0,10)}.xlsx`);
  toast('Evidências exportadas');
}

   BACKUP JSON — salva e restaura TODO o estado do painel
   (registros, limites por via, limite padrão, monitoramento de KM).
   Subir o .json de volta no painel restaura os dados para qualquer pessoa.
   ============================================================ */
const JSON_APP='Painel Telemetria Logon', JSON_SCHEMA=1;
function exportJson(){
  if(!S.files.length){ toast('Carregue dados antes de exportar'); return; }
  const snap={
    app:JSON_APP, schema:JSON_SCHEMA, geradoEm:new Date().toISOString(),
    // somente campos de origem; limite/tolerância/gap são recalculados na importação
    files:S.files.map(f=>({plate:f.plate,name:f.name,rows:f.rows.map(r=>({
      data:r.data.toISOString(), motorista:r.motorista, ign:r.ign,
      vel:isNaN(r.vel)?null:r.vel, odom:isNaN(r.odom)?null:r.odom,
      lat:isNaN(r.lat)?null:r.lat, lon:isNaN(r.lon)?null:r.lon,
      endereco:r.endereco||'', via:r.via||null
    }))})),
    limits:S.limits, defaultLimit:S.defaultLimit, kmMonitors:S.kmMonitors
  };
  const blob=new Blob([JSON.stringify(snap)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=`Telemetria_Backup_${stamp()}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),4000);
  toast('Backup JSON exportado');
}
/* null (JSON) volta a NaN: os checks do painel usam isNaN(vel/odom) */
function nn(v){ return v==null?NaN:+v; }
function importJson(obj){
  if(!obj || obj.app!==JSON_APP || !Array.isArray(obj.files)) throw new Error('JSON não é um backup deste painel');
  S.files=obj.files.map(f=>({
    plate:String(f.plate||''), name:String(f.name||f.plate||'backup'),
    rows:(f.rows||[]).map(r=>{
      const d=new Date(r.data);
      return { plate:String(f.plate||''), data:d, ts:d.getTime(),
        motorista:r.motorista||'Não informado', ign:String(r.ign||'').toUpperCase(),
        vel:nn(r.vel), odom:nn(r.odom), lat:nn(r.lat), lon:nn(r.lon),
        endereco:r.endereco||'', via:r.via||null };
    }).filter(r=>!isNaN(r.ts))
  }));
  S.limits=Array.isArray(obj.limits)?obj.limits:[];
  S.defaultLimit=obj.defaultLimit??null;
  S.kmMonitors=Array.isArray(obj.kmMonitors)?obj.kmMonitors:[];
  S.filters={ign:'ON'}; S.xf={};
}

/* ============================================================
   EXPORTAÇÃO POR ABA — PDF / PPT / EXCEL (respeita filtros)
   Cada view preenche S.exportCtx = {title, kpis[], charts[], tables[], insights[]}
   ============================================================ */
function bindExportMenu(){
  const btn=$('#exportMenuBtn'), menu=$('#exportMenu');
  if(!btn||!menu) return;
  btn.onclick=e=>{ e.stopPropagation(); menu.classList.toggle('hidden'); };
  menu.querySelectorAll('[data-export]').forEach(b=>b.onclick=e=>{
    e.stopPropagation(); menu.classList.add('hidden'); doExport(b.dataset.export);
  });
}
function currentFilterSummary(){
  const f=S.filters; const p=[];
  p.push('Período: '+((f._dataIni||f._dataFim)?`${f._dataIni?fmtBR(f._dataIni):'…'} até ${f._dataFim?fmtBR(f._dataFim):'…'}`:'todo o período'));
  if(f._horaIni||f._horaFim) p.push(`Hora: ${f._horaIni||'00:00:00'} até ${f._horaFim||'23:59:59'}`);
  const ign=f.ign===undefined?'ON':f.ign; p.push('Ignição: '+(ign==='ON'?'Ligada':ign==='OFF'?'Desligada':'Ambas'));
  if(f.plates&&f.plates.length) p.push('Placas: '+f.plates.join(', '));
  if(f.drivers&&f.drivers.length) p.push('Condutores: '+f.drivers.join(', '));
  if(f.vias&&f.vias.length) p.push('Vias: '+f.vias.join(', '));
  if(f.velMin!=null) p.push('Vel. maior ou igual a '+f.velMin+' km/h');
  if(f.velMax!=null) p.push('Vel. menor ou igual a '+f.velMax+' km/h');
  const xf=S.xf||{}; Object.keys(xf).filter(k=>xf[k]!=null).forEach(k=>p.push(xfLabel(k)+': '+xf[k]));
  return p;
}
async function chartImages(ctx){
  const imgs=[];
  for(const ch of (ctx.charts||[])){
    const inst=S.charts[ch.key];
    if(!inst||!inst.dataURI) continue;
    // scale:3 rende o canvas em 3x a resolução do SVG (canvas.width = svgWidth * scale),
    // eliminando o embaçamento ao esticar o gráfico na página. Ref. verificada no
    // source do ApexCharts 3.45.2 (Exports.js, método dataURI).
    try{
      const res=await inst.dataURI({scale:3});
      if(res&&res.imgURI){
        const sz=await imgNaturalSize(res.imgURI); // proporção real evita distorção no PDF
        imgs.push({title:ch.title,uri:res.imgURI,ratio:(sz&&sz.w>0)?sz.h/sz.w:0.5});
      }
    }catch(e){ console.warn('chart img falhou',ch.key,e); }
  }
  return imgs;
}
function imgNaturalSize(uri){
  return new Promise(res=>{ const im=new Image();
    im.onload=()=>res({w:im.naturalWidth,h:im.naturalHeight});
    im.onerror=()=>res(null); im.src=uri; });
}
function stamp(){ const d=new Date(); const p=n=>String(n).padStart(2,'0'); return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}_${p(d.getHours())}h${p(d.getMinutes())}`; }
function safeName(s){ return String(s||'aba').replace(/\s+/g,'_').replace(/[^\w\-À-ÿ]/g,''); }

async function doExport(type){
  const ctx=S.exportCtx;
  if(!S.rows.length){ toast('Carregue dados antes de exportar'); return; }
  if(type==='all'){ await exportAll(); return; }
  if(type==='json'){ exportJson(); return; }
  if(!ctx){ toast('Nada para exportar nesta aba'); return; }
  toast('Gerando '+type.toUpperCase()+'…');
  try{
    if(type==='xlsx') exportTabXlsx(ctx);
    else if(type==='pdf') await exportTabPdf(ctx);
    else if(type==='ppt') await exportTabPpt(ctx);
  }catch(e){ console.error('Export falhou',e); toast('Falha ao gerar '+type.toUpperCase()); }
}

function exportTabXlsx(ctx){
  const wb=XLSX.utils.book_new();
  const resumo=[['Painel de Telemetria Logon · '+ctx.title],['Gerado em',new Date().toLocaleString('pt-BR')],[],['Filtros aplicados']];
  currentFilterSummary().forEach(s=>resumo.push([s]));
  if(ctx.kpis&&ctx.kpis.length){ resumo.push([],['Indicadores']); ctx.kpis.forEach(k=>resumo.push([k.label,k.value])); }
  if(ctx.insights&&ctx.insights.length){ resumo.push([],['Leitura inteligente']); ctx.insights.forEach(t=>resumo.push([t])); }
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(resumo),'Resumo');
  (ctx.tables||[]).forEach((t,i)=>{
    const aoa=[t.columns, ...t.rows];
    let name=`${i+1}. ${t.title||'Tabela'}`.replace(/[\\\/\?\*\[\]:]/g,' ').slice(0,31);
    XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(aoa),name);
  });
  XLSX.writeFile(wb,`Telemetria_${safeName(ctx.title)}_${stamp()}.xlsx`);
  toast('Excel exportado');
}

async function exportTabPdf(ctx){
  if(!window.jspdf){ toast('Biblioteca PDF indisponível (sem conexão?)'); return; }
  const {jsPDF}=window.jspdf;
  const doc=new jsPDF({unit:'pt',format:'a4'});
  const W=doc.internal.pageSize.getWidth(), H=doc.internal.pageSize.getHeight();
  const M=40; let y=M; const green=[114,128,70];
  doc.setFont('helvetica','bold'); doc.setFontSize(15); doc.setTextColor(43,42,38); doc.text('Painel de Telemetria Logon',M,y); y+=18;
  doc.setFontSize(12); doc.setTextColor(114,128,70); doc.text(ctx.title,M,y); doc.setFont('helvetica','normal'); y+=15;
  doc.setFontSize(8); doc.setTextColor(120,120,110); doc.text('Gerado em '+new Date().toLocaleString('pt-BR'),M,y); y+=14;
  doc.setFontSize(8); doc.setTextColor(90,90,80);
  const flText=doc.splitTextToSize('Filtros: '+currentFilterSummary().join('   •   '),W-2*M);
  doc.text(flText,M,y); y+=flText.length*10+8;
  const imgs=await chartImages(ctx);
  y=pdfBodyForCtx(doc,ctx,imgs,y,{W,H,M,green});
  const pages=doc.internal.getNumberOfPages();
  for(let i=1;i<=pages;i++){ doc.setPage(i); doc.setFontSize(7); doc.setTextColor(150,150,140);
    doc.text(`Logon · Arauco · Projeto Sucuriú, página ${i} de ${pages}`,M,H-16); }
  doc.save(`Telemetria_${safeName(ctx.title)}_${stamp()}.pdf`);
  toast('PDF exportado');
}

// Corpo de uma aba dentro de um PDF ja iniciado: KPIs, insights, graficos e tabelas.
// Retorna a nova posicao vertical. Usado tanto na exportacao de aba quanto no painel completo.
function pdfBodyForCtx(doc,ctx,imgs,y,dims){
  const {W,H,M,green}=dims;
  if(ctx.kpis&&ctx.kpis.length){
    doc.autoTable({startY:y,margin:{left:M,right:M},theme:'grid',head:[['Indicador','Valor']],
      body:ctx.kpis.map(k=>[k.label,k.value]),headStyles:{fillColor:green,fontSize:8},bodyStyles:{fontSize:8},styles:{cellPadding:3}});
    y=doc.lastAutoTable.finalY+14;
  }
  if(ctx.insights&&ctx.insights.length){
    if(y>H-80){doc.addPage();y=M;}
    doc.setFont('helvetica','bold'); doc.setFontSize(9); doc.setTextColor(43,42,38); doc.text('Leitura inteligente',M,y); doc.setFont('helvetica','normal'); y+=12;
    doc.setFontSize(8); doc.setTextColor(70,70,64);
    ctx.insights.forEach(t=>{ const lines=doc.splitTextToSize('• '+t,W-2*M); if(y+lines.length*10>H-M){doc.addPage();y=M;} doc.text(lines,M,y); y+=lines.length*10+4; });
    y+=6;
  }
  for(const im of (imgs||[])){
    let iw=W-2*M, ih=iw*(im.ratio||0.5);
    const maxH=H-2*M-30; // gráfico alto (ex.: todos os condutores) é reduzido para caber na página
    if(ih>maxH){ iw=iw*maxH/ih; ih=maxH; }
    if(y+ih+34>H-M){ doc.addPage(); y=M; }
    doc.setFont('helvetica','bold'); doc.setFontSize(13); doc.setTextColor(114,128,70);
    doc.text(im.title,M,y); doc.setFont('helvetica','normal'); y+=16;
    doc.addImage(im.uri,'PNG',M,y,iw,ih,undefined,'SLOW'); y+=ih+18;
  }
  (ctx.tables||[]).forEach(t=>{
    if(!t.rows.length) return;
    const cap=1500, body=t.rows.slice(0,cap);
    if(y>H-120){ doc.addPage(); y=M; }
    doc.setFont('helvetica','bold'); doc.setFontSize(9); doc.setTextColor(43,42,38); doc.text(t.title,M,y); doc.setFont('helvetica','normal'); y+=4;
    doc.autoTable({startY:y+4,margin:{left:M,right:M},theme:'striped',head:[t.columns],
      body:body.map(r=>r.map(c=>String(c))),headStyles:{fillColor:green,fontSize:7},
      bodyStyles:{fontSize:7},styles:{cellPadding:2,overflow:'linebreak'}});
    y=doc.lastAutoTable.finalY+12;
    if(t.rows.length>cap){ if(y>H-M){doc.addPage();y=M;} doc.setFontSize(7); doc.setTextColor(150,150,140);
      doc.text(`${t.rows.length-cap} linhas adicionais omitidas, use a exportação Excel para a base completa.`,M,y); y+=14; }
  });
  return y;
}

// Painel completo: percorre as views, captura graficos e monta um unico PDF.
async function exportAll(){
  if(!window.jspdf){ toast('Biblioteca PDF indisponível (sem conexão?)'); return; }
  toast('Gerando painel completo, aguarde…');
  const original=VIEW;
  const plan=[
    {id:'visao',label:'Visão Geral'},
    {id:'veloc',label:'Análise de Velocidade'},
    {id:'intel',label:'Leitura Inteligente'},
    {id:'km',label:'Monitor de KM'},
    {id:'registros',label:'Registros de Telemetria'}
  ];
  try{
    const sections=[];
    for(const p of plan){
      go(p.id);
      await new Promise(r=>setTimeout(r,500)); // deixa o ApexCharts concluir o render antes de capturar
      const ctx=S.exportCtx;
      const imgs=ctx?await chartImages(ctx):[];
      sections.push({label:p.label,ctx,imgs});
    }
    go(original);
    const {jsPDF}=window.jspdf;
    const doc=new jsPDF({unit:'pt',format:'a4'});
    const W=doc.internal.pageSize.getWidth(), H=doc.internal.pageSize.getHeight();
    const M=40; const green=[114,128,70]; let y=M;
    // capa
    doc.setFont('helvetica','bold'); doc.setFontSize(20); doc.setTextColor(43,42,38); doc.text('Painel de Telemetria Logon',M,y); y+=24;
    doc.setFontSize(14); doc.setTextColor(114,128,70); doc.text('Relatório consolidado do painel',M,y); doc.setFont('helvetica','normal'); y+=18;
    doc.setFontSize(9); doc.setTextColor(120,120,110); doc.text('Gerado em '+new Date().toLocaleString('pt-BR'),M,y); y+=15;
    doc.setFontSize(9); doc.setTextColor(90,90,80);
    const flText=doc.splitTextToSize('Filtros aplicados: '+currentFilterSummary().join('   •   '),W-2*M);
    doc.text(flText,M,y); y+=flText.length*11+8;
    doc.setFontSize(8); doc.setTextColor(120,120,110);
    doc.text('Seções: '+plan.map(p=>p.label).join(' · '),M,y);
    for(const sec of sections){
      if(!sec.ctx) continue;
      doc.addPage(); y=M;
      doc.setFont('helvetica','bold'); doc.setFontSize(15); doc.setTextColor(114,128,70); doc.text(sec.label,M,y); doc.setFont('helvetica','normal'); y+=8;
      doc.setDrawColor(210); doc.line(M,y,W-M,y); y+=16;
      y=pdfBodyForCtx(doc,sec.ctx,sec.imgs,y,{W,H,M,green});
    }
    const pages=doc.internal.getNumberOfPages();
    for(let i=1;i<=pages;i++){ doc.setPage(i); doc.setFontSize(7); doc.setTextColor(150,150,140);
      doc.text(`Logon · Arauco · Projeto Sucuriú, painel completo, página ${i} de ${pages}`,M,H-16); }
    doc.save(`Telemetria_Painel_Completo_${stamp()}.pdf`);
    toast('Painel completo exportado');
  }catch(e){ console.error('exportAll falhou',e); toast('Falha ao gerar painel completo'); try{go(original);}catch(_){} }
}

async function exportTabPpt(ctx){
  if(!window.PptxGenJS){ toast('Biblioteca PPT indisponível (sem conexão?)'); return; }
  const pptx=new PptxGenJS(); pptx.defineLayout({name:'W',width:10,height:5.63}); pptx.layout='W';
  const GREEN='728046', INK='2B2A26', SOFT='5E5B52';
  let s=pptx.addSlide(); s.background={color:'F4F5F0'};
  s.addText('Painel de Telemetria Logon',{x:0.5,y:0.6,w:9,h:0.6,fontSize:26,bold:true,color:INK});
  s.addText(ctx.title,{x:0.5,y:1.3,w:9,h:0.5,fontSize:18,bold:true,color:GREEN});
  s.addText('Gerado em '+new Date().toLocaleString('pt-BR'),{x:0.5,y:1.9,w:9,h:0.3,fontSize:11,color:SOFT});
  s.addText(currentFilterSummary().map(t=>({text:t,options:{bullet:true,fontSize:11,color:INK,breakLine:true}})),{x:0.6,y:2.4,w:8.8,h:2.9,valign:'top'});
  if(ctx.kpis&&ctx.kpis.length){
    let k=pptx.addSlide(); k.background={color:'FFFFFF'};
    k.addText('Indicadores',{x:0.5,y:0.3,w:9,h:0.5,fontSize:20,bold:true,color:GREEN});
    const rows=[[{text:'Indicador',options:{bold:true,color:'FFFFFF',fill:{color:GREEN}}},{text:'Valor',options:{bold:true,color:'FFFFFF',fill:{color:GREEN}}}],
      ...ctx.kpis.map(kp=>[{text:kp.label,options:{color:INK}},{text:String(kp.value),options:{color:INK,bold:true}}])];
    k.addTable(rows,{x:0.5,y:1.0,w:9,fontSize:12,border:{type:'solid',color:'D4D6C8',pt:0.5}});
  }
  if(ctx.insights&&ctx.insights.length){
    let i=pptx.addSlide(); i.background={color:'FFFFFF'};
    i.addText('Leitura inteligente',{x:0.5,y:0.3,w:9,h:0.5,fontSize:20,bold:true,color:GREEN});
    i.addText(ctx.insights.map(t=>({text:t,options:{bullet:true,fontSize:12,color:INK,breakLine:true,paraSpaceAfter:6}})),{x:0.6,y:1.0,w:8.8,h:4.3,valign:'top'});
  }
  const imgs=await chartImages(ctx);
  for(const im of imgs){
    let c=pptx.addSlide(); c.background={color:'FFFFFF'};
    c.addText(im.title,{x:0.5,y:0.28,w:9,h:0.6,fontSize:24,bold:true,color:GREEN});
    c.addImage({data:im.uri,x:0.6,y:1.05,w:8.8,h:4.25,sizing:{type:'contain',w:8.8,h:4.25}});
  }
  (ctx.tables||[]).forEach(t=>{
    if(!t.rows.length) return;
    const cap=60, body=t.rows.slice(0,cap);
    let ts=pptx.addSlide(); ts.background={color:'FFFFFF'};
    ts.addText(t.title,{x:0.5,y:0.3,w:9,h:0.5,fontSize:18,bold:true,color:GREEN});
    const head=t.columns.map(c=>({text:String(c),options:{bold:true,color:'FFFFFF',fill:{color:GREEN}}}));
    const trows=[head, ...body.map(r=>r.map(c=>({text:String(c),options:{color:INK}})))];
    ts.addTable(trows,{x:0.3,y:1.0,w:9.4,fontSize:8,border:{type:'solid',color:'E4E5DC',pt:0.5},autoPage:true,autoPageRepeatHeader:true,newSlideStartY:0.6});
    if(t.rows.length>cap) ts.addText(`${t.rows.length-cap} linhas adicionais, base completa no Excel.`,{x:0.3,y:5.25,w:9.4,h:0.3,fontSize:9,italic:true,color:SOFT});
  });
  pptx.writeFile({fileName:`Telemetria_${safeName(ctx.title)}_${stamp()}.pptx`});
  toast('PowerPoint exportado');
}

/* ============================================================
   PERSISTÊNCIA (IndexedDB)
   ============================================================ */
let DB=null;
function openDB(){
  return new Promise((res)=>{
    const rq=indexedDB.open('telemetria_logon',1);
    rq.onupgradeneeded=e=>{ e.target.result.createObjectStore('state'); };
    rq.onsuccess=e=>{ DB=e.target.result; res(DB); };
    rq.onerror=()=>res(null);
  });
}
function persist(){
  if(!DB) return;
  try{
    const snap={
      files:S.files.map(f=>({plate:f.plate,name:f.name,rows:f.rows.map(r=>({...r,data:r.data.toISOString()}))})),
      limits:S.limits, defaultLimit:S.defaultLimit, kmMonitors:S.kmMonitors, theme:S.theme
    };
    DB.transaction('state','readwrite').objectStore('state').put(snap,'main');
  }catch(e){ console.warn('persist falhou',e); }
}
function restore(){
  return new Promise(res=>{
    if(!DB) return res(false);
    const rq=DB.transaction('state','readonly').objectStore('state').get('main');
    rq.onsuccess=()=>{
      const s=rq.result; if(!s){ res(false); return; }
      S.files=(s.files||[]).map(f=>({...f,rows:f.rows.map(r=>({...r,data:new Date(r.data),ts:new Date(r.data).getTime()}))}));
      S.limits=s.limits||[]; S.defaultLimit=s.defaultLimit??null; S.kmMonitors=s.kmMonitors||[];
      S.theme=s.theme||'light';
      rebuildDataset(); res(S.rows.length>0);
    };
    rq.onerror=()=>res(false);
  });
}

/* ============================================================
   INIT
   ============================================================ */
(async function init(){
  await openDB();
  const had=await restore();
  document.documentElement.setAttribute('data-theme',S.theme);
  renderShell();
  if(had){ toast('Dados restaurados da sessão anterior'); }
})();
</script>
